<div class="container py-4">

  <div class="card-header bg-white d-flex justify-content-between align-items-center">
  
    <div class="card-body">
      <h3 class="text-primary fw-bold">Alquilar producto</h3>
      <div class="row g-4">

        <!-- Calendario -->
        <div class="col-lg-7">
          <h5 class="fw-bold mb-3">
            Selecciona las fechas
          </h5>
          <div *ngIf="cargando" class="text-center py-5">
            <div class="spinner-border text-primary"></div>
            <p class="mt-2 text-muted">Cargando calendario...</p>
          </div>

          <full-calendar
            *ngIf="!cargando"
            [options]="calendarOptions">
          </full-calendar>
          
          <div class="mt-3">
            <span class="badge bg-danger me-2">Reservado</span>
            <span class="badge bg-success">Fechas seleccionadas</span>
          </div>
        </div>

        <!-- Formulario -->
        <div class="col-lg-5">
          <div class="card border-0 shadow-sm">
            <div class="card-body">

              <h5 class="fw-bold text-primary mb-4">
                Resumen del alquiler
              </h5>

              <form (ngSubmit)="alquilarProducto()">

                <div class="mb-3">
                  <label class="form-label fw-semibold">Fecha inicio</label>
                  <input
                    type="date"
                    class="form-control"
                    name="fechaInicio"
                    [(ngModel)]="fechaInicio"
                    (change)="calcularPrecioTotal()"
                    required
                  >
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold">Fecha fin</label>
                  <input
                    type="date"
                    class="form-control"
                    name="fechaFin"
                    [(ngModel)]="fechaFin"
                    (change)="calcularPrecioTotal()"
                    required
                  >
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold">
                    Precio por día
                  </label>

                  <input
                    type="text"
                    class="form-control"
                    [value]="precioAlquilerDia + ' €/día'"
                    readonly
                  >
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold">
                    Precio total
                  </label>

                  <input
                    type="text"
                    class="form-control fw-bold text-primary"
                    [value]="precioTotal + ' €'"
                    readonly
                  >
                </div>

                <div class="form-check mb-4">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="opcionCompra"
                    name="opcionCompra"
                    [(ngModel)]="opcionCompra"
                  >

                  <label class="form-check-label" for="opcionCompra">
                    Me interesa opción a compra
                  </label>
                </div>

                <div *ngIf="error" class="alert alert-danger">
                  {{ error }}
                </div>

                <div *ngIf="mensaje" class="alert alert-success">
                  {{ mensaje }}
                </div>

                <button
                  type="submit"
                  class="btn btn-primary w-100 fw-bold"
                  [disabled]="!fechaInicio || !fechaFin || precioTotal <= 0"
                >
                  Confirmar alquiler
                </button>

              </form>
            </div>
          </div>
          <div class="d-flex justify-content-end mt-3">
            <button
              class="btn btn-outline-info btn-sm fw-semibold"
              (click)="volver()"
            >
              ← Volver
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <div
    class="toast-container position-fixed top-0 end-0 p-3"
    style="z-index: 9999;"
  >
    <div
      id="toastAlquiler"
      class="toast align-items-center text-bg-success border-0"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >
      <div class="d-flex">
        <div class="toast-body">
          Producto alquilado correctamente.
        </div>

        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          data-bs-dismiss="toast"
          aria-label="Cerrar"
        ></button>
      </div>
    </div>
  </div>
</div>
