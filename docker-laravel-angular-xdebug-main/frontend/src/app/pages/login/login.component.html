<div class="container min-vh-100 d-flex justify-content-center align-items-center bg-light">
  <div class="card shadow border-0 p-4" style="width: 100%; max-width: 420px; border-radius: 20px;">
    
    <div class="text-center mb-4">
      <h2 class="fw-bold text-primary">Bienvenido</h2>
      <p class="text-muted mb-0">Inicia sesión para continuar</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="mb-3">
        <label class="form-label fw-semibold">Correo electrónico</label>
        <input 
          type="email" 
          class="form-control form-control-lg"
          formControlName="email"
          placeholder="ejemplo@correo.com"
        >
        <small
          class="text-danger"
          *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Introduce un email válido
        </small>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Contraseña</label>
        <input 
          type="password" 
          class="form-control form-control-lg"
          formControlName="password"
          placeholder="********"
        >
        <small
          class="text-danger"
          *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          La contraseña es obligatoria
        </small>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger py-2">
        {{ errorMessage }}
      </div>

      <button 
        type="submit" 
        class="btn btn-primary btn-lg w-100 rounded-pill"
        [disabled]="loading"
      >
        <span *ngIf="!loading">Entrar</span>
        <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
      </button>
    </form>

    <p class="text-center mt-4 mb-0 text-muted">
      ¿No tienes cuenta?
      <a routerLink="/register" class="text-decoration-none fw-semibold">Regístrate</a>
    </p>
  </div>
</div>
