<!--<full-calendar [options]="calendarOptions"></full-calendar>-->
<div class="container-fluid py-4 bg-light min-vh-100">
  <div class="d-flex justify-content-center mb-4">
    <div class="btn-group shadow-sm">
      <button class="btn btn-primary px-5 py-3 fw-bold active">
        Mis Devoluciones
      </button>

      <button class="btn btn-outline-primary px-5 py-3 fw-bold">
        Productos Prestados
      </button>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-lg-6">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body p-4">

          <h3 class="fw-bold text-primary mb-4">
            Fechas de Devolución
          </h3>

          <full-calendar
            [options]="calendarOptions">
          </full-calendar>

        </div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-header bg-white p-4">
          <h3 class="fw-bold text-primary mb-0">
            Mis Productos Alquilados
          </h3>
        </div>

        <div class="card-body p-3">

          <div
            class="card border-0 shadow-sm mb-3"
            *ngFor="let alquiler of alquileres"
          >
            <div class="card-body">
              <div class="row align-items-center">
                <div class="col-3">
                  <img
                    [src]="alquiler.imagen"
                    [alt]="alquiler.nombre"
                    class="img-fluid rounded"
                    style="height: 125px; object-fit: cover; width: 100%;"
                  >
                </div>
                <div class="col-7">
                  <h5 class="fw-bold text-primary mb-2">
                    {{ alquiler.nombre }}
                  </h5>

                  <p class="text-muted small mb-1">
                    Alquilado de
                  </p>

                  <p class="fw-semibold mb-2">
                    {{ alquiler.propietario }}
                  </p>

                  <p class="text-muted small mb-1">
                    Devolución
                  </p>

                  <p class="fw-bold text-warning mb-2">
                    {{ alquiler.fecha_devolucion | date:'d MMM y' }}
                  </p>

                  <p class="fw-bold text-primary mb-0">
                    {{ alquiler.precio_alquiler_dia }}€/día
                  </p>
                </div>

                <!-- Estado -->
                <div class="col-2 text-end">
                  <span
                    class="badge rounded-pill"
                    [ngClass]="alquiler.estado === 'Pendiente'
                      ? 'bg-success'
                      : 'bg-secondary'"
                  >
                    {{ alquiler.estado }}
                  </span>
                </div>

              </div>
            </div>
          </div>

          <div *ngIf="alquileres.length === 0" class="text-center text-muted py-5">
            No tienes productos alquilados.
          </div>

        </div>
      </div>
    </div>

  </div>
</div>
