<div class="container py-4">

  <div class="card border-0 shadow-sm">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
      <h3 class="fw-bold text-primary mb-0">
        Confirmar devolución
      </h3>

      <a routerLink="/calendario" class="btn btn-outline-secondary btn-sm">
        ← Volver
      </a>
    </div>

    <div class="card-body p-4">

      <form (ngSubmit)="confirmarDevolucion()">

        <div class="mb-4">
          <h5 class="fw-bold text-primary">Estado de la devolución</h5>

          <div class="form-check mt-3">
            <input
              class="form-check-input"
              type="radio"
              name="devuelto"
              id="devueltoSi"
              [value]="true"
              [(ngModel)]="devuelto"
            >
            <label class="form-check-label" for="devueltoSi">
              Producto devuelto
            </label>
          </div>

          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="devuelto"
              id="devueltoNo"
              [value]="false"
              [(ngModel)]="devuelto"
            >
            <label class="form-check-label" for="devueltoNo">
              Producto no devuelto
            </label>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">
            Estado del producto
          </label>

          <select
            class="form-select"
            name="estadoProducto"
            [(ngModel)]="estadoProducto"
          >
            <option *ngFor="let estado of estadosProducto" [value]="estado">
              {{ estado }}
            </option>
          </select>
        </div>

        <div class="mb-4">
          <h5 class="fw-bold text-primary">Incidencias</h5>

          <div class="form-check mb-3">
            <input
              class="form-check-input"
              type="checkbox"
              id="incidencia"
              name="incidencia"
              [(ngModel)]="incidencia"
            >
            <label class="form-check-label" for="incidencia">
              Hubo una incidencia con esta devolución
            </label>
          </div>

          <div *ngIf="incidencia">
            <div class="mb-3">
              <label class="form-label fw-semibold">
                Tipo de incidencia
              </label>

              <select
                class="form-select"
                name="tipoIncidencia"
                [(ngModel)]="tipoIncidencia"
              >
                <option value="">Selecciona una incidencia</option>
                <option *ngFor="let tipo of tiposIncidencia" [value]="tipo">
                  {{ tipo }}
                </option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">
                Descripción de la incidencia
              </label>

              <textarea
                class="form-control"
                rows="4"
                name="descripcionIncidencia"
                [(ngModel)]="descripcionIncidencia"
                placeholder="Explica qué ha ocurrido..."
              ></textarea>
            </div>
          </div>
        </div>

        <div class="mb-4">
          <h5 class="fw-bold text-primary">Valoración del usuario</h5>

          <label class="form-label fw-semibold">
            Puntuación
          </label>

          <select
            class="form-select mb-3"
            name="valoracionUsuario"
            [(ngModel)]="valoracionUsuario"
          >
            <option [value]="5">5 - Excelente</option>
            <option [value]="4">4 - Buena</option>
            <option [value]="3">3 - Normal</option>
            <option [value]="2">2 - Mala</option>
            <option [value]="1">1 - Muy mala</option>
          </select>

          <label class="form-label fw-semibold">
            Comentario
          </label>

          <textarea
            class="form-control"
            rows="3"
            name="comentarioValoracion"
            [(ngModel)]="comentarioValoracion"
            placeholder="Añade un comentario sobre el usuario..."
          ></textarea>
        </div>

        <div *ngIf="mensaje" class="alert alert-success">
          {{ mensaje }}
        </div>

        <div *ngIf="error" class="alert alert-danger">
          {{ error }}
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100 fw-bold"
          [disabled]="incidencia && !tipoIncidencia"
        >
          Confirmar devolución
        </button>

      </form>

    </div>
  </div>

</div>
